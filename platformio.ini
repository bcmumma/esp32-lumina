; Lumina v3: one PlatformIO project, two firmware environments.
; Layout and version choices: docs/DECISIONS.md (2026-10-12).
;
;   pio run -e sender   -t upload --upload-port COM<n>
;   pio run -e receiver -t upload --upload-port COM<n>

[platformio]
default_envs = sender, receiver

[env]
; pioarduino community platform: Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5.
; The official platformio/espressif32 still ships Arduino 2.0.17, which lacks ESP_I2S.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3-WROOM-1 N16R8: 16 MB quad flash, 8 MB octal PSRAM. USB through a CH343 UART bridge.
[env:sender]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<sender/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

; ESP32-D0WD-V3, 4 MB flash, no PSRAM. USB through a CP210x UART bridge.
[env:receiver]
board = esp32dev
build_src_filter = +<receiver/>
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
